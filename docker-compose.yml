version: '3.8'

services:
  # 1. PostgreSQL DB 컨테이너
  db:
    image: postgres:18-alpine
    container_name: dc_asset_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    depends_on: []

  # 2. Express 웹 앱 컨테이너
  app:
    build: .
    container_name: dc_asset_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db # docker-compose 내부 DB 서비스 이름
    depends_on:
      - db

volumes:
  pgdata: